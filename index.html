<!DOCTYPE html>
<html lang="id">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>AlgoQuest — Pseudocode & Flowchart</title>
<style>
:root{--bg:#0f172a;--bg2:#0b1226;--card:rgba(30,41,75,.55);--line:rgba(148,163,184,.18);--cyan:#06b6d4;--blue:#3b82f6;--green:#10b981;--red:#f43f5e;--amber:#f59e0b;--text:#e2e8f0;--muted:#94a3b8;--mono:'JetBrains Mono','Fira Code',Consolas,'Courier New',monospace}
*{box-sizing:border-box;margin:0;padding:0}
html{scroll-behavior:smooth}
body{background:var(--bg);color:var(--text);font-family:'Inter',system-ui,-apple-system,'Segoe UI',Roboto,sans-serif;line-height:1.6;min-height:100vh;overflow-x:hidden}
[hidden]{display:none!important}
h1{font-size:clamp(1.5rem,3vw,2.1rem);line-height:1.2}
h2{font-size:1.3rem}h3{font-size:1.08rem;margin-bottom:8px}h4{margin:16px 0 8px;color:var(--cyan);font-size:.95rem;letter-spacing:.03em}
p{margin-bottom:8px}ul,ol{padding-left:22px;margin-bottom:8px}li{margin:3px 0}
b{color:#f1f5f9}small{color:var(--muted)}
.muted{color:var(--muted)}
.bgfx{position:fixed;inset:0;z-index:-1;overflow:hidden;background:radial-gradient(1200px 600px at 80% -10%,rgba(59,130,246,.18),transparent 60%),radial-gradient(900px 500px at -10% 30%,rgba(6,182,212,.14),transparent 60%),var(--bg)}
.bgfx:after{content:"";position:absolute;inset:0;background-image:linear-gradient(rgba(148,163,184,.06) 1px,transparent 1px),linear-gradient(90deg,rgba(148,163,184,.06) 1px,transparent 1px);background-size:44px 44px;-webkit-mask-image:radial-gradient(circle at 50% 30%,#000,transparent 75%);mask-image:radial-gradient(circle at 50% 30%,#000,transparent 75%)}
.orb{position:absolute;border-radius:50%;filter:blur(60px);opacity:.3;animation:float 14s ease-in-out infinite}
.orb.a{width:340px;height:340px;background:var(--cyan);left:-80px;top:20%}
.orb.b{width:300px;height:300px;background:var(--blue);right:-60px;top:55%;animation-delay:-5s}
.orb.c{width:240px;height:240px;background:var(--green);left:40%;bottom:-100px;animation-delay:-9s}
@keyframes float{0%,100%{transform:translateY(0)}50%{transform:translateY(-26px)}}
@keyframes glow{0%,100%{box-shadow:0 0 0 0 rgba(6,182,212,.0),0 0 14px rgba(6,182,212,.25)}50%{box-shadow:0 0 0 4px rgba(6,182,212,.08),0 0 30px rgba(6,182,212,.55)}}
@keyframes pop{from{opacity:0;transform:translateY(10px) scale(.985)}to{opacity:1;transform:none}}
@keyframes shake{0%,100%{transform:translateX(0)}20%,60%{transform:translateX(-6px)}40%,80%{transform:translateX(6px)}}
@keyframes dash{to{stroke-dashoffset:-20}}
@keyframes pulse{0%,100%{transform:scale(1)}50%{transform:scale(1.08)}}
@keyframes flowarrow{0%{transform:translateX(-4px);opacity:.3}50%{opacity:1}100%{transform:translateX(4px);opacity:.3}}
@keyframes fall{to{transform:translate(var(--dx),105vh) rotate(720deg);opacity:.8}}
/* top bar */
.top{position:sticky;top:0;z-index:50;display:flex;justify-content:space-between;align-items:center;padding:10px 22px;background:rgba(11,18,38,.82);backdrop-filter:blur(12px);border-bottom:1px solid var(--line)}
.brand{display:flex;gap:10px;align-items:center;cursor:pointer}
.brand b{display:block;line-height:1.1;font-size:1.05rem;letter-spacing:.02em}
.logo{width:38px;height:38px;border-radius:11px;display:grid;place-items:center;font-size:22px;color:#04121c;background:linear-gradient(135deg,var(--cyan),var(--blue));animation:glow 3s infinite}
.topr{display:flex;gap:10px}
.chip{background:rgba(15,23,42,.8);border:1px solid var(--line);padding:5px 14px;border-radius:999px;font-family:var(--mono);font-size:.9rem;white-space:nowrap}
.chip.warn{border-color:var(--red);color:#fecdd3;animation:pulse 1s infinite}
.chip.xp{color:#6ee7b7;border-color:rgba(16,185,129,.4)}
/* layout */
.layout{display:grid;grid-template-columns:268px 1fr;gap:22px;max-width:1440px;margin:0 auto;padding:22px}
#nav{position:sticky;top:78px;align-self:start;display:flex;flex-direction:column;gap:8px}
.nv{display:flex;gap:12px;align-items:center;text-align:left;background:var(--card);border:1px solid var(--line);color:var(--text);padding:10px 12px;border-radius:14px;cursor:pointer;font:inherit;transition:.25s}
.nv:hover{border-color:rgba(6,182,212,.6);transform:translateX(3px)}
.nv .ic{width:36px;height:36px;border-radius:10px;display:grid;place-items:center;background:rgba(6,182,212,.12);font-size:1.1rem;flex:none}
.nv b{display:block;font-size:.88rem;line-height:1.25}
.nv.act{background:linear-gradient(135deg,rgba(6,182,212,.22),rgba(59,130,246,.2));border-color:var(--cyan);box-shadow:0 0 22px rgba(6,182,212,.25)}
.nv.dn .ic{background:rgba(16,185,129,.2);color:var(--green);font-weight:700}
.navfoot{margin-top:6px;padding:12px;border:1px dashed var(--line);border-radius:14px;font-size:.8rem}
main{min-width:0}
#app>*{animation:pop .4s ease both}
/* cards */
.card{background:var(--card);border:1px solid var(--line);border-radius:18px;padding:20px;margin-bottom:18px;backdrop-filter:blur(8px);box-shadow:0 10px 30px rgba(0,0,0,.25);transition:.25s}
.card.hov:hover{transform:translateY(-3px);border-color:rgba(6,182,212,.55);box-shadow:0 0 0 1px rgba(6,182,212,.2),0 14px 40px rgba(6,182,212,.14)}
.g2,.g3,.g4{display:grid;gap:16px;margin-bottom:18px}
.g2{grid-template-columns:repeat(auto-fit,minmax(300px,1fr))}
.g3{grid-template-columns:repeat(auto-fit,minmax(230px,1fr))}
.g4{grid-template-columns:repeat(auto-fit,minmax(180px,1fr))}
.g2>.card,.g3>.card,.g4>.card{margin-bottom:0}
.pill{display:inline-block;background:rgba(6,182,212,.15);color:#67e8f9;border:1px solid rgba(6,182,212,.4);border-radius:999px;padding:2px 12px;font-size:.72rem;font-weight:700;letter-spacing:.08em;margin-bottom:6px}
.mh{display:flex;justify-content:space-between;gap:18px;flex-wrap:wrap;align-items:flex-end;margin-bottom:18px}
.mtimer{min-width:210px;background:var(--card);border:1px solid var(--line);border-radius:14px;padding:10px 14px}
.mtimer b{font-family:var(--mono);font-size:1.15rem;color:#67e8f9}
.bar{height:6px;border-radius:99px;background:rgba(148,163,184,.2);overflow:hidden;margin-top:6px}
.bar i{display:block;height:100%;width:0;background:linear-gradient(90deg,var(--cyan),var(--green));transition:width .6s}
/* buttons */
.btn{font:inherit;font-weight:600;border:1px solid var(--line);background:rgba(15,23,42,.8);color:var(--text);padding:9px 18px;border-radius:12px;cursor:pointer;transition:.2s}
.btn:hover{border-color:var(--cyan);transform:translateY(-1px)}
.btn:disabled{opacity:.45;cursor:not-allowed;transform:none}
.btn.primary{background:linear-gradient(135deg,var(--cyan),var(--blue));color:#03121b;border:none;box-shadow:0 6px 20px rgba(6,182,212,.35)}
.btn.primary:hover{box-shadow:0 8px 30px rgba(6,182,212,.6)}
.btn.good{background:linear-gradient(135deg,var(--green),#059669);color:#03150f;border:none}
.btn.ghost{background:transparent}
.btn.sm{padding:5px 12px;font-size:.85rem}
.btn.big{padding:14px 28px;font-size:1.05rem}
.btns{display:flex;gap:10px;flex-wrap:wrap;align-items:center;margin-top:10px}
.fin{display:flex;justify-content:center;margin:26px 0 40px}
/* tabs */
.tabs{display:flex;gap:8px;flex-wrap:wrap;margin-bottom:16px}
.tab{font:inherit;font-weight:600;font-size:.9rem;background:var(--card);border:1px solid var(--line);color:var(--muted);padding:8px 16px;border-radius:999px;cursor:pointer;transition:.2s}
.tab:hover{color:var(--text);border-color:var(--cyan)}
.tab.act{color:#03121b;background:linear-gradient(135deg,var(--cyan),var(--blue));border-color:transparent;box-shadow:0 0 18px rgba(6,182,212,.4)}
.tabbody.pop{animation:pop .35s ease}
/* inputs */
.inp{background:#0a1022;border:1px solid var(--line);color:var(--text);border-radius:10px;padding:8px 12px;font:inherit;font-size:.92rem;min-width:0}
.inp:focus{outline:none;border-color:var(--cyan);box-shadow:0 0 0 3px rgba(6,182,212,.2)}
textarea.inp{width:100%;min-height:110px;font-family:var(--mono);resize:vertical}
select.inp{cursor:pointer}
.vl{display:flex;gap:8px;align-items:center;font-family:var(--mono);font-size:.9rem}
.vl span{color:#67e8f9}
/* code */
.code{background:#0a1022;border:1px solid var(--line);border-radius:12px;padding:10px 0;font-family:var(--mono);font-size:.84rem;overflow-x:auto}
.ln{display:flex;gap:10px;padding:1px 14px;white-space:pre;border-left:3px solid transparent;transition:.2s}
.ln .no{color:#475569;width:22px;flex:none;text-align:right;user-select:none}
.ln.on{background:rgba(6,182,212,.16);border-left-color:var(--cyan)}
.ln.pk{cursor:pointer}.ln.pk:hover{background:rgba(244,63,94,.14);border-left-color:var(--red)}
.ln.ok{background:rgba(16,185,129,.18);border-left-color:var(--green)}
.ln.bad{background:rgba(244,63,94,.18);border-left-color:var(--red)}
.kw{color:#38bdf8;font-weight:700}.str{color:#34d399}.num{color:#fbbf24}
.console{background:#050a18;border:1px solid var(--line);border-radius:12px;padding:10px 14px;font-family:var(--mono);font-size:.84rem;min-height:56px;margin-top:10px}
.console div{animation:pop .3s}
.console .g{color:#6ee7b7;font-weight:700}.console .m{color:var(--muted)}.console .r{color:#fda4af}
.mon{display:flex;gap:8px;flex-wrap:wrap;margin-bottom:6px;min-height:30px}
.var{background:rgba(59,130,246,.15);border:1px solid rgba(59,130,246,.45);padding:2px 12px;border-radius:8px;font-family:var(--mono);font-size:.85rem;animation:pop .3s}
.runbar{display:flex;gap:12px;flex-wrap:wrap;align-items:center;margin-top:10px}
.demo{display:grid;grid-template-columns:minmax(280px,1fr) minmax(300px,1.1fr);gap:16px}
.flowbox{background:#0a1022;border:1px solid var(--line);border-radius:14px;padding:10px;overflow:auto;display:flex;justify-content:center}
.flowbox.clk .fnode{cursor:pointer}
/* flowchart svg */
.flow{height:auto}
.fnode rect,.fnode polygon{fill:#0b1226;stroke-width:1.8;transition:.3s}
.fnode.term rect{stroke:var(--green)}.fnode.io polygon{stroke:var(--blue)}.fnode.proc rect{stroke:var(--cyan)}.fnode.dec polygon{stroke:var(--amber)}
.fnode text{fill:#e2e8f0;font:12px var(--mono);pointer-events:none}
.fnode.on rect,.fnode.on polygon{fill:rgba(6,182,212,.3);stroke:#fff;filter:drop-shadow(0 0 9px #06b6d4)}
.fnode.done rect,.fnode.done polygon{fill:rgba(16,185,129,.16)}
.fnode.sel rect,.fnode.sel polygon{fill:rgba(59,130,246,.3);stroke:#93c5fd}
.edge{fill:none;stroke:#475569;stroke-width:1.6}
.edge.on{stroke:#06b6d4;stroke-width:2.6;stroke-dasharray:7 5;animation:dash .5s linear infinite}
.edge.past{stroke:#0e8aa6;stroke-width:2.2}
.elabel{fill:#fbbf24;font:700 11px var(--mono)}
.sym{width:100%;max-width:130px;height:auto}
.sym *{fill:rgba(255,255,255,.04);stroke:var(--c);stroke-width:2.2}
.sym .hd{fill:var(--c)}
.sym text{fill:var(--c);stroke:none;font:700 16px var(--mono)}
.symcard{text-align:center}
.symcard .sym{margin:4px auto 6px;animation:float 5s ease-in-out infinite}
/* misc ui */
.tag{display:inline-block;font:700 .72rem var(--mono);padding:2px 8px;border-radius:6px;white-space:nowrap}
.tag.in{background:rgba(59,130,246,.2);color:#93c5fd}.tag.if{background:rgba(245,158,11,.2);color:#fcd34d}.tag.then{background:rgba(16,185,129,.2);color:#6ee7b7}
.row{display:flex;gap:8px;align-items:center;flex-wrap:wrap;margin-bottom:8px}
.row .inp{flex:1;min-width:90px}.row .inp.vn{max-width:140px}.row .inp.bval{max-width:100px}.row .inp.bo{max-width:76px;flex:none}
.rowh{display:flex;justify-content:space-between;gap:8px;flex-wrap:wrap;align-items:center}
.x{background:none;border:1px solid var(--line);color:var(--muted);border-radius:8px;width:30px;height:30px;cursor:pointer}
.x:hover{color:var(--red);border-color:var(--red)}
.warn{color:#fcd34d;font-size:.85rem}.okmsg{color:#6ee7b7;font-size:.88rem;margin-top:8px}
.lab{display:grid;grid-template-columns:minmax(320px,1fr) minmax(340px,1.15fr);gap:18px;align-items:start}
.labR>.card:last-child,.lab>.card{margin-bottom:18px}
table{width:100%;border-collapse:collapse;font-size:.88rem;margin:8px 0}
th,td{padding:8px 10px;border-bottom:1px solid var(--line);text-align:left;vertical-align:top}
th{color:var(--cyan);font-size:.8rem;text-transform:uppercase;letter-spacing:.05em}
td code,p code,li code{font-family:var(--mono);background:#0a1022;padding:1px 6px;border-radius:5px;color:#67e8f9}
.callout{border-left:4px solid var(--cyan);background:rgba(6,182,212,.08);padding:10px 14px;border-radius:0 12px 12px 0;margin:10px 0}
.callout.warn2{border-color:var(--amber);background:rgba(245,158,11,.08)}
.callout.ok2{border-color:var(--green);background:rgba(16,185,129,.08)}
/* mcq */
.mcq{margin-bottom:16px}.mcq .q{font-weight:600;margin-bottom:8px}
.opts{display:grid;gap:8px}
.opt{font:inherit;text-align:left;background:rgba(15,23,42,.8);border:1px solid var(--line);color:var(--text);padding:9px 14px;border-radius:12px;cursor:pointer;transition:.2s}
.opt:hover:not(:disabled){border-color:var(--cyan);transform:translateX(3px)}
.opt.ok{background:rgba(16,185,129,.2);border-color:var(--green)}
.opt.bad{background:rgba(244,63,94,.18);border-color:var(--red);animation:shake .4s}
.opt:disabled{cursor:default}
.fb{margin-top:6px;font-size:.88rem;min-height:1.2em}.fb.good{color:#6ee7b7}.fb.bad{color:#fda4af}
/* hero */
.hero{position:relative;overflow:hidden;padding:42px 30px;text-align:center;background:linear-gradient(135deg,rgba(6,182,212,.14),rgba(59,130,246,.12) 55%,rgba(16,185,129,.1))}
.hero h1{font-size:clamp(2rem,5vw,3.2rem);background:linear-gradient(90deg,#67e8f9,#93c5fd,#6ee7b7);-webkit-background-clip:text;background-clip:text;color:transparent}
.hero .fl{position:absolute;opacity:.5;border:2px solid var(--cyan);animation:float 7s ease-in-out infinite;box-shadow:0 0 22px rgba(6,182,212,.5)}
.hero .f1{width:64px;height:64px;left:6%;top:18%;transform:rotate(45deg);border-color:var(--amber)}
.hero .f2{width:96px;height:44px;right:7%;top:20%;border-color:var(--blue);transform:skewX(-20deg);animation-delay:-2s}
.hero .f3{width:90px;height:40px;left:12%;bottom:14%;border-radius:20px;border-color:var(--green);animation-delay:-4s}
.hero .f4{width:60px;height:60px;right:12%;bottom:14%;border-radius:50%;animation-delay:-3s}
.hero>*:not(.fl){position:relative}
.alloc{display:flex;height:34px;border-radius:12px;overflow:hidden;gap:3px;margin:10px 0}
.alloc i{display:grid;place-items:center;font:700 .75rem var(--mono);color:#03121b;font-style:normal}
.mapcard{cursor:pointer;display:flex;gap:12px;align-items:flex-start}
.mapcard .big,.casebtn .big{font-size:1.9rem}
.casebtn{font:inherit;color:var(--text);text-align:left;cursor:pointer;display:flex;flex-direction:column;gap:2px}
.casebtn.act{border-color:var(--cyan);box-shadow:0 0 24px rgba(6,182,212,.35)}
.ipo{display:flex;align-items:center;gap:10px;flex-wrap:wrap;justify-content:center;margin:12px 0}
.ipo .bx{padding:14px 22px;border:2px solid var(--line);border-radius:14px;text-align:center;min-width:130px;transition:.3s}
.ipo .bx.on{border-color:var(--cyan);box-shadow:0 0 26px rgba(6,182,212,.6);transform:scale(1.06)}
.ipo .ar{font-size:1.6rem;color:var(--cyan);animation:flowarrow 1.2s infinite}
/* game */
.gbar{display:flex;justify-content:space-between;gap:12px;flex-wrap:wrap;align-items:center}
.lvnav{display:flex;gap:8px;flex-wrap:wrap}
.lvb{font:inherit;font-weight:700;background:rgba(15,23,42,.8);color:var(--text);border:1px solid var(--line);border-radius:12px;padding:6px 14px;cursor:pointer;display:flex;flex-direction:column;align-items:center;min-width:86px;transition:.2s}
.lvb small{font-weight:400;font-size:.68rem}
.lvb.act{border-color:var(--cyan);box-shadow:0 0 20px rgba(6,182,212,.45)}
.lvb.dn{border-color:var(--green);color:#6ee7b7}
.lvb:disabled{opacity:.4;cursor:not-allowed}
.gscore b{color:#fbbf24;font-size:1.2rem}
.pairs{display:grid;grid-template-columns:1fr 1fr;gap:18px}
.pcol{display:grid;gap:10px}
.pr{font:inherit;color:var(--text);background:rgba(15,23,42,.8);border:2px solid var(--line);border-radius:14px;padding:8px 12px;cursor:pointer;transition:.2s;min-height:68px;display:flex;align-items:center;justify-content:center;text-align:center}
.pr:hover{border-color:var(--cyan)}
.pr.pick{border-color:var(--cyan);box-shadow:0 0 20px rgba(6,182,212,.5)}
.pr.solved{border-color:var(--green);background:rgba(16,185,129,.14);cursor:default}
.pr.wrong{animation:shake .4s;border-color:var(--red)}
.pr .sym{max-width:100px}
.stm{display:flex;gap:10px;align-items:center;justify-content:space-between;flex-wrap:wrap;padding:8px 0;border-bottom:1px solid var(--line)}
.stm.ok{color:#6ee7b7}
.stm.wrong{animation:shake .4s}
.chips{display:flex;gap:6px;flex-wrap:wrap;margin:8px 0;min-height:32px}
.chp{font:.82rem var(--mono);background:rgba(59,130,246,.18);border:1px solid rgba(59,130,246,.5);border-radius:8px;padding:3px 10px}
.fillcode{background:#0a1022;border:1px solid var(--line);border-radius:12px;padding:12px 14px;font-family:var(--mono);font-size:.86rem;overflow-x:auto}
.fillcode .l3{white-space:pre;padding:3px 0}
.fillcode .inp{padding:3px 8px;font-family:var(--mono);font-size:.82rem;margin:0 2px}
.fillcode .inp.ok,.inp.ok{border-color:var(--green);background:rgba(16,185,129,.15)}
.fillcode .inp.bad,.inp.bad{border-color:var(--red);background:rgba(244,63,94,.15)}
.pool{display:flex;gap:8px;flex-wrap:wrap;margin:8px 0}
.pl{font:.84rem var(--mono);background:#0a1022;border:1px solid var(--blue);color:var(--text);border-radius:10px;padding:6px 12px;cursor:pointer;transition:.2s}
.pl:hover{box-shadow:0 0 14px rgba(59,130,246,.6);transform:translateY(-2px)}
.ansbox{min-height:60px}
.lik{display:grid;grid-template-columns:1fr auto;gap:10px;align-items:center;padding:10px 0;border-bottom:1px solid var(--line)}
.scale{display:flex;gap:6px}
.scale label{cursor:pointer}
.scale input{display:none}
.scale span{display:grid;place-items:center;width:38px;height:38px;border-radius:50%;border:2px solid var(--line);font-weight:700;transition:.2s}
.scale input:checked+span{background:linear-gradient(135deg,var(--cyan),var(--blue));color:#03121b;border-color:transparent;box-shadow:0 0 16px rgba(6,182,212,.6)}
.scale span:hover{border-color:var(--cyan)}
.meter{height:14px;border-radius:99px;background:rgba(148,163,184,.2);overflow:hidden}
.meter i{display:block;height:100%;background:linear-gradient(90deg,var(--blue),var(--green));border-radius:99px;transition:width .8s}
.confetti{position:fixed;inset:0;pointer-events:none;z-index:99}
.confetti i{position:absolute;top:-14px;width:8px;height:14px;border-radius:2px;animation:fall 2s ease-in forwards}
#toast{position:fixed;left:50%;bottom:24px;transform:translateX(-50%);z-index:100;display:flex;flex-direction:column;gap:6px;align-items:center;pointer-events:none}
#toast div{background:rgba(11,18,38,.95);border:1px solid var(--cyan);padding:8px 18px;border-radius:12px;box-shadow:0 0 24px rgba(6,182,212,.4);animation:pop .3s;font-size:.9rem}
.report{white-space:pre-wrap;font-family:var(--mono);font-size:.82rem;background:#0a1022;border:1px solid var(--line);border-radius:12px;padding:14px}
@media(max-width:960px){
 .layout{grid-template-columns:1fr;padding:14px}
 #nav{position:sticky;top:62px;z-index:40;flex-direction:row;overflow-x:auto;background:rgba(15,23,42,.92);padding:8px;border-radius:14px;margin:0 -2px}
 .nv{flex:none;padding:6px 10px}.nv small,.navfoot{display:none}
 .demo,.lab,.pairs{grid-template-columns:1fr}
 .top{padding:8px 12px}.brand small{display:none}
}
@media print{body{background:#fff;color:#000}.bgfx,.top,#nav,.btn,.fin{display:none!important}.card{background:#fff;box-shadow:none;border:1px solid #bbb}.layout{display:block}*{color:#000!important}}
</style>
</head>
<body>
<div class="bgfx"><i class="orb a"></i><i class="orb b"></i><i class="orb c"></i></div>
<header class="top">
 <div class="brand" data-go="0"><span class="logo">◇</span><div><b>AlgoQuest</b><small>Pseudocode &amp; Flowchart</small></div></div>
 <div class="topr"><div class="chip" id="tchip" title="Sisa waktu dari 120 menit">⏱ <b id="timer">120:00</b></div><div class="chip xp">⚡ <b id="xp">0</b> XP</div></div>

<script>
'use strict';
/* =====================================================================
   AlgoQuest — Platform belajar mandiri 120 menit
   Materi: Pseudocode & Flowchart (Input, Output, Percabangan)
   ===================================================================== */
const $=(s,r=document)=>r.querySelector(s),$$=(s,r=document)=>[...r.querySelectorAll(s)];
const esc=s=>String(s).replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;');
const attr=s=>esc(s).replace(/"/g,'&quot;');
const shuf=a=>a.map(x=>[Math.random(),x]).sort((p,q)=>p[0]-q[0]).map(x=>x[1]);
const fmt=s=>String(Math.floor(s/60)).padStart(2,'0')+':'+String(s%60).padStart(2,'0');
let UID=0;
const MODS=[
 {n:1,t:'Dasar Teori',min:15,ic:'📘',d:'Konsep, simbol ISO, pseudocode & percabangan'},
 {n:2,t:'Studi Kasus',min:20,ic:'🔍',d:'Penilaian, lampu lalu lintas, diskon'},
 {n:3,t:'Lab Maya',min:30,ic:'🧪',d:'Simulator algoritma interaktif'},
 {n:4,t:'Game 5 Level',min:30,ic:'🎮',d:'Cocokkan, telusuri, lengkapi, debug, tantang'},
 {n:5,t:'LKPD Digital',min:15,ic:'📝',d:'Soal latihan & tugas mandiri'},
 {n:6,t:'Refleksi & Evaluasi',min:10,ic:'🪞',d:'Self-assessment & refleksi metakognitif'}];

/* ---------- state & persistence ---------- */
const KEY='algoquest_v1';
const S0=()=>({started:false,startAt:0,score:0,gs:0,mod:0,name:'',done:{},spent:{},ans:{},cs:0,lab:null,miss:{},game:{cur:1,done:{}},lk:{fill:{},t1:'',t1ok:false,t2:{v:'umur',c:'umur >= 17',a:'Boleh mendaftar',b:'Belum cukup umur'}},rf:{lik:{},q:['','','']},over:false});
let S=(function(){try{const r=JSON.parse(localStorage.getItem(KEY));if(r&&r.v===1)return Object.assign(S0(),r.s);}catch(e){}return S0();})();
function save(){try{localStorage.setItem(KEY,JSON.stringify({v:1,s:S}));}catch(e){}}
function toast(m){const t=$('#toast'),d=document.createElement('div');d.textContent=m;t.appendChild(d);setTimeout(()=>d.remove(),2400);}
function addScore(n,t){S.score+=n;if(t==='g')S.gs=(S.gs||0)+n;$('#xp').textContent=S.score;const g=$('#gs');if(g)g.textContent=S.gs||0;toast('+'+n+' XP');save();}
function burst(){const c=document.createElement('div');c.className='confetti';const cl=['#06b6d4','#3b82f6','#10b981','#f59e0b','#f43f5e'];for(let i=0;i<40;i++){const p=document.createElement('i');p.style.left=Math.random()*100+'vw';p.style.background=cl[i%5];p.style.animationDelay=Math.random()*.5+'s';p.style.setProperty('--dx',(Math.random()*240-120)+'px');c.appendChild(p);}document.body.appendChild(c);setTimeout(()=>c.remove(),2800);}

/* ---------- timer ---------- */
function remain(){return S.started?Math.max(0,7200-Math.floor((Date.now()-S.startAt)/1000)):7200;}
let tickN=0;
function tick(){
 const r=remain();$('#timer').textContent=fmt(r);$('#tchip').classList.toggle('warn',S.started&&r<600&&r>0);
 if(!S.started)return;
 if(S.mod>0){S.spent[S.mod]=(S.spent[S.mod]||0)+1;const m=MODS[S.mod-1],sp=S.spent[S.mod],a=$('#mtime'),b=$('#mbar');
  if(a)a.textContent=fmt(sp)+' / '+m.min+':00';if(b){b.style.width=Math.min(100,sp/(m.min*60)*100)+'%';b.style.background=sp>m.min*60?'var(--amber)':'';}}
 if(r===0&&!S.over){S.over=true;toast('⏰ Waktu 120 menit habis — selesaikan dan lihat laporanmu!');}
 if(++tickN%10===0)save();
}
setInterval(tick,1000);

/* ---------- pseudocode highlighter & code view ---------- */
const KW=/("[^"]*")|\b(START|END|INPUT|OUTPUT|IF|THEN|ELSE|ENDIF|AND|OR|NOT)\b|\b(\d+(?:\.\d+)?)\b/g;
function hl(s){return esc(s).replace(KW,(m,a,b,c)=>a?'<span class="str">'+a+'</span>':b?'<span class="kw">'+b+'</span>':'<span class="num">'+c+'</span>');}
function codeHTML(lines,cls){return '<div class="code '+(cls||'')+'">'+lines.map((l,i)=>'<div class="ln" data-i="'+i+'"><span class="no">'+(i+1)+'</span><span>'+hl(l)+'</span></div>').join('')+'</div>';}
function markLine(el,i){$$('.ln.on',el).forEach(x=>x.classList.remove('on'));if(i!==undefined&&i!==null){const l=$('.ln[data-i="'+i+'"]',el);if(l)l.classList.add('on');}}
function log(out,t,c){const d=document.createElement('div');if(c)d.className=c;d.textContent=t;out.appendChild(d);out.scrollTop=out.scrollHeight;}
const msgOf=o=>String(o).replace(/^OUTPUT\s*/,'').replace(/^"|"$/g,'');

/* ---------- flowchart engine ---------- */
function nodeSize(t,text){
 const L=Math.max(...String(text).split('\n').map(s=>s.length));
 if(t==='term')return[Math.max(110,L*8+44),40];
 if(t==='dec')return[Math.max(176,Math.ceil(L*7.2*1.3+40)),86];
 return[Math.max(160,Math.ceil(L*7.2+48)),44];
}
function buildFlow(m){
 const nodes=[],edges=[],pre=m.pre||[],br=m.branches||[];
 const YES=m.swap?'Tidak':'Ya',NO=m.swap?'Ya':'Tidak';
 let maxMain=110,maxDec=0,maxOut=0;
 pre.forEach(p=>maxMain=Math.max(maxMain,nodeSize(p.t,p.text)[0]));
 br.forEach(b=>{maxDec=Math.max(maxDec,nodeSize('dec',b.cond+' ?')[0]);maxOut=Math.max(maxOut,nodeSize('io',b.out)[0]);});
 const elseW=m.elseOut?nodeSize('io',m.elseOut)[0]:0;
 const cx=Math.ceil(Math.max(maxMain,maxDec,elseW,120)/2)+14;
 const outX=br.length?Math.ceil(cx+maxDec/2+58+maxOut/2):cx;
 const W=br.length?Math.ceil(outX+maxOut/2+22):cx*2;
 const mk=(id,t,text,y,x)=>{const sz=nodeSize(t,text);const n={id,t,text,x:x===undefined?cx:x,y,w:sz[0],h:sz[1]};nodes.push(n);return n;};
 const below=(p,id,t,text,gap)=>mk(id,t,text,p.y+p.h/2+gap+nodeSize(t,text)[1]/2);
 const link=(a,b,o)=>edges.push(Object.assign({f:a.id,to:b.id,fs:'b',ts:'t'},o||{}));
 let prev=mk('start','term','START',28);
 pre.forEach((p,i)=>{const n=below(prev,'p'+i,p.t,p.text,28);link(prev,n);prev=n;});
 const decs=[],outs=[];
 br.forEach((b,k)=>{
  const n=below(prev,'d'+k,'dec',b.cond+' ?',k?38:28);
  link(prev,n,k?{label:NO}:undefined);
  const o=mk('o'+k,'io',b.out,n.y,outX);
  link(n,o,{fs:'r',ts:'l',label:YES});
  decs.push(n);outs.push(o);prev=n;
 });
 let endN;
 if(br.length&&m.elseOut){const e=below(prev,'e','io',m.elseOut,42);link(prev,e,{label:NO});endN=below(e,'end','term','END',28);link(e,endN);}
 else if(br.length){endN=below(prev,'end','term','END',42);link(prev,endN,{label:NO});}
 else{endN=below(prev,'end','term','END',28);link(prev,endN);}
 outs.forEach(o=>link(o,endN,{fs:'r',ts:'r',via:[[W-8,o.y],[W-8,endN.y]]}));
 return{w:W,h:Math.ceil(endN.y+endN.h/2+16),nodes,edges};
}
function nodeSVG(n){
 const x=n.x,y=n.y,w=n.w,h=n.h,t=n.t;let s;
 if(t==='term')s='<rect x="'+(x-w/2)+'" y="'+(y-h/2)+'" width="'+w+'" height="'+h+'" rx="'+(h/2)+'"/>';
 else if(t==='proc')s='<rect x="'+(x-w/2)+'" y="'+(y-h/2)+'" width="'+w+'" height="'+h+'" rx="4"/>';
 else if(t==='io')s='<polygon points="'+(x-w/2+14)+','+(y-h/2)+' '+(x+w/2)+','+(y-h/2)+' '+(x+w/2-14)+','+(y+h/2)+' '+(x-w/2)+','+(y+h/2)+'"/>';
 else s='<polygon points="'+x+','+(y-h/2)+' '+(x+w/2)+','+y+' '+x+','+(y+h/2)+' '+(x-w/2)+','+y+'"/>';
 const ls=String(n.text).split('\n'),y0=y-(ls.length-1)*7;
 return '<g class="fnode '+t+'" data-id="'+n.id+'">'+s+ls.map((l,i)=>'<text x="'+x+'" y="'+(y0+i*14+4)+'" text-anchor="middle">'+esc(l)+'</text>').join('')+'</g>';
}
function flowHTML(sp){
 const u=++UID,M={};sp.nodes.forEach(n=>M[n.id]=n);
 const A=(n,s)=>s==='t'?[n.x,n.y-n.h/2]:s==='b'?[n.x,n.y+n.h/2]:s==='l'?[n.x-n.w/2,n.y]:[n.x+n.w/2,n.y];
 let g='',lab='';
 sp.edges.forEach(e=>{
  const a=M[e.f],b=M[e.to],p=[A(a,e.fs)].concat(e.via||[],[A(b,e.ts)]);
  const d='M'+p.map(q=>q[0].toFixed(1)+' '+q[1].toFixed(1)).join(' L');
  g+='<path class="edge" data-e="'+e.f+'>'+e.to+'" d="'+d+'" marker-end="url(#ar'+u+')" data-mon="url(#aron'+u+')" data-moff="url(#ar'+u+')"/>';
  if(e.label){const s=p[0],lx=e.fs==='r'?s[0]+8:s[0]+8,ly=e.fs==='r'?s[1]-8:s[1]+16;lab+='<text class="elabel" x="'+lx+'" y="'+ly+'">'+e.label+'</text>';}
 });
 return '<svg class="flow" viewBox="0 0 '+sp.w+' '+sp.h+'" style="width:100%;max-width:'+sp.w+'px" role="img" aria-label="Flowchart"><defs><marker id="ar'+u+'" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0L10 5L0 10z" fill="#64748b"/></marker><marker id="aron'+u+'" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0L10 5L0 10z" fill="#06b6d4"/></marker></defs>'+g+sp.nodes.map(nodeSVG).join('')+lab+'</svg>';
}
function clearFlow(box){
 $$('.fnode',box).forEach(n=>n.classList.remove('on','done','sel'));
 $$('.edge',box).forEach(e=>{e.classList.remove('on','past');e.setAttribute('marker-end',e.dataset.moff);});
}
function showStep(box,ids,i){
 $$('.fnode.on',box).forEach(n=>{n.classList.remove('on');n.classList.add('done');});
 $$('.edge.on',box).forEach(e=>{e.classList.remove('on');e.classList.add('past');});
 const n=$('[data-id="'+ids[i]+'"]',box);if(n)n.classList.add('on');
 if(i>0){const e=$('[data-e="'+ids[i-1]+'>'+ids[i]+'"]',box);if(e){e.classList.add('on');e.setAttribute('marker-end',e.dataset.mon);e.parentNode.appendChild(e);}}
}
function playPath(box,ids,o){
 o=o||{};const tok=(box._tok=(box._tok||0)+1);clearFlow(box);
 return new Promise(res=>{let i=0;
  const step=()=>{
   if(box._tok!==tok)return res(false);
   if(i>=ids.length)return res(true);
   showStep(box,ids,i);if(o.onStep)o.onStep(ids[i],i);i++;setTimeout(step,o.delay||700);
  };step();});
}
function pathFor(m,k){
 const ids=['start'];(m.pre||[]).forEach((_,i)=>ids.push('p'+i));
 const br=m.branches||[];
 for(let j=0;j<br.length;j++){ids.push('d'+j);if(j===k){ids.push('o'+j);break;}}
 if(k===-1&&m.elseOut)ids.push('e');
 ids.push('end');return ids;
}
function genPseudo(m){
 const L=[],map={};const push=(s,id)=>{if(id)map[id]=L.length;L.push(s);};
 push('START','start');
 (m.pre||[]).forEach((p,i)=>push(p.code||p.text,'p'+i));
 (m.branches||[]).forEach((b,k)=>{push((k?'ELSE IF ':'IF ')+b.cond+' THEN','d'+k);push('   '+b.out,'o'+k);});
 if(m.elseOut){push('ELSE');push('   '+m.elseOut,'e');}
 if((m.branches||[]).length)push('ENDIF');
 push('END','end');return{lines:L,map};
}
/* symbol icons (ISO 5807) */
function symSVG(k){
 const c={term:'#10b981',io:'#3b82f6',proc:'#06b6d4',dec:'#f59e0b',flow:'#94a3b8',conn:'#a78bfa'}[k];let s='';
 if(k==='term')s='<rect x="10" y="14" width="100" height="36" rx="18"/>';
 else if(k==='io')s='<polygon points="28,14 112,14 92,50 8,50"/>';
 else if(k==='proc')s='<rect x="10" y="14" width="100" height="36" rx="3"/>';
 else if(k==='dec')s='<polygon points="60,6 112,32 60,58 8,32"/>';
 else if(k==='flow')s='<line x1="12" y1="32" x2="96" y2="32"/><polygon class="hd" points="108,32 94,24 94,40"/>';
 else s='<circle cx="60" cy="32" r="22"/><text x="60" y="38" text-anchor="middle">A</text>';
 return '<svg viewBox="0 0 120 64" class="sym" style="--c:'+c+'">'+s+'</svg>';
}
/* ---------- generic demo (kode + flowchart + eksekusi animasi) ---------- */
function createDemo(el,cfg){
 const m=cfg.model,ps=genPseudo(m),vars=cfg.vars||[];
 const ctr=vars.map((v,i)=>'<label class="vl"><span>'+v.name+'</span>'+(v.options?'<select class="inp dv" data-i="'+i+'">'+v.options.map(o=>'<option'+(o==v.value?' selected':'')+'>'+o+'</option>').join('')+'</select>':'<input class="inp dv" data-i="'+i+'" type="'+(v.type==='number'?'number':'text')+'" value="'+attr(v.value)+'" style="width:110px">')+'</label>').join('');
 el.innerHTML='<div class="demo"><div><div class="cb">'+codeHTML(ps.lines)+'</div><div class="runbar">'+ctr+'<button class="btn primary run">▶ Jalankan</button><button class="btn ghost rst">↺ Ulang</button></div><div class="console"><div class="out"><div class="m">Tekan ▶ Jalankan untuk melihat alur eksekusi…</div></div></div></div><div class="flowbox"></div></div>';
 const fb=$('.flowbox',el),cb=$('.cb',el),out=$('.out',el);
 fb.innerHTML=flowHTML(buildFlow(m));
 const br=m.branches||[];
 $('.run',el).onclick=()=>{
  const vals={};$$('.dv',el).forEach(inp=>{const v=vars[+inp.dataset.i];vals[v.name]=v.type==='number'?parseFloat(inp.value):inp.value;});
  if(vars.some(v=>v.type==='number'&&isNaN(vals[v.name]))){toast('Isi angka yang valid dulu ya');return;}
  let k=-1;for(let j=0;j<br.length;j++){if(br[j].test&&br[j].test(vals)){k=j;break;}}
  out.innerHTML='';
  playPath(fb,pathFor(m,k),{delay:700,onStep:id=>{
   markLine(cb,ps.map[id]);let r;
   if(cfg.say)r=cfg.say(id,vals,k);
   if(r===undefined){
    const i=+id.slice(1);
    if(id==='start')r='▶ Program dimulai';
    else if(id[0]==='p'&&vars[i]&&/^INPUT/.test(m.pre[i].text))r='INPUT '+vars[i].name+' → '+vals[vars[i].name];
    else if(id[0]==='d')r='Cek: '+br[i].cond+' → '+(i===k?'BENAR ✔':'SALAH ✘');
    else if(id[0]==='o')r='OUTPUT: '+msgOf(br[i].out);
    else if(id==='e')r='OUTPUT: '+msgOf(m.elseOut);
    else if(id==='end')r='■ Program selesai';
    if(r&&(id[0]==='o'||id==='e'))return log(out,r,'g');
   }
   if(r)log(out,r,id==='end'||id==='start'?'m':'');
  }});
 };
 $('.rst',el).onclick=()=>{fb._tok=(fb._tok||0)+1;clearFlow(fb);markLine(cb);out.innerHTML='<div class="m">Siap dijalankan ulang.</div>';};
}
/* ---------- tabs & mcq ---------- */
function mkTabs(host,items,start){
 host.innerHTML='<div class="tabs">'+items.map((x,i)=>'<button class="tab" data-i="'+i+'">'+x.t+'</button>').join('')+'</div><div class="tabbody"></div>';
 const body=$('.tabbody',host),bar=$('.tabs',host);
 const show=i=>{$$('.tab',bar).forEach((b,j)=>b.classList.toggle('act',j===i));body.innerHTML='';body.classList.remove('pop');void body.offsetWidth;body.classList.add('pop');items[i].r(body);};
 bar.addEventListener('click',e=>{const b=e.target.closest('.tab');if(b)show(+b.dataset.i);});
 show(start||0);
}
function mcq(id,q,opts,a,why,pts){
 const st=S.ans[id]&&S.ans[id].ok;
 return '<div class="mcq" data-id="'+id+'" data-a="'+a+'" data-why="'+attr(why)+'" data-pts="'+(pts||5)+'"><p class="q">'+q+'</p><div class="opts">'+opts.map((o,i)=>'<button class="opt'+(st&&i===a?' ok':'')+'" data-i="'+i+'"'+(st?' disabled':'')+'>'+o+'</button>').join('')+'</div><div class="fb'+(st?' good':'')+'">'+(st?'✅ '+esc(why):'')+'</div></div>';
}
function mcqPick(q,o){
 const id=q.dataset.id,a=+q.dataset.a,i=+o.dataset.i;if(S.ans[id]&&S.ans[id].ok)return;
 const fb=$('.fb',q);
 if(i===a){S.ans[id]={ok:true};o.classList.add('ok');$$('.opt',q).forEach(b=>b.disabled=true);fb.textContent='✅ Benar! '+q.dataset.why;fb.className='fb good';if(!q._w)addScore(+q.dataset.pts);save();}
 else{q._w=true;o.classList.add('bad');o.disabled=true;fb.textContent='❌ Belum tepat — baca lagi dan coba pilihan lain.';fb.className='fb bad';}
}
/* ---------- shell ---------- */
const views={};
function modHead(n,desc){const m=MODS[n-1];return '<div class="mh"><div><span class="pill">MODUL '+n+' · '+m.min+' MENIT</span><h1>'+m.ic+' '+m.t+'</h1><p class="muted">'+desc+'</p></div><div class="mtimer"><small>Waktu di modul ini (saran '+m.min+' menit)</small><br><b id="mtime">'+fmt(S.spent[n]||0)+' / '+m.min+':00</b><div class="bar"><i id="mbar" style="width:'+Math.min(100,(S.spent[n]||0)/(m.min*60)*100)+'%"></i></div></div></div>';}
function finBlock(n){return '<div class="fin"><button class="btn primary big" data-fin="'+n+'">'+(n<6?'✔ Selesai Modul '+n+' → Lanjut':'🏁 Selesai & Buat Laporan')+'</button></div>';}
function go(n){
 if(n>0&&!S.started){S.started=true;S.startAt=Date.now();}
 S.mod=n;save();render();window.scrollTo({top:0,behavior:'smooth'});
}
function finishMod(n){
 if(n===6&&!reflOK()){toast('Lengkapi 8 pernyataan skala & 3 refleksi (min. 15 karakter) dulu ya');return;}
 if(!S.done[n]){S.done[n]=true;addScore(20);burst();}
 save();if(n<6)go(n+1);else render();
}
function renderNav(){
 const dn=Object.keys(S.done).filter(k=>S.done[k]).length;
 $('#nav').innerHTML='<button class="nv '+(S.mod===0?'act':'')+'" data-go="0"><span class="ic">🏠</span><span><b>Beranda</b><small>Peta belajar</small></span></button>'+
 MODS.map(m=>'<button class="nv '+(S.mod===m.n?'act':'')+' '+(S.done[m.n]?'dn':'')+'" data-go="'+m.n+'"><span class="ic">'+(S.done[m.n]?'✔':m.ic)+'</span><span><b>M'+m.n+' · '+m.t+'</b><small>'+m.min+' menit</small></span></button>').join('')+
 '<div class="navfoot">Progres: <b>'+dn+'/6</b> modul<div class="bar"><i style="width:'+(dn/6*100)+'%"></i></div></div>';
}
function render(){renderNav();$('#xp').textContent=S.score;const v=$('#app');v.innerHTML='';views[S.mod](v);tick();}
document.addEventListener('click',e=>{
 const g=e.target.closest('[data-go]');if(g){go(+g.dataset.go);return;}
 const f=e.target.closest('[data-fin]');if(f){finishMod(+f.dataset.fin);return;}
 const o=e.target.closest('.mcq .opt');if(o){mcqPick(o.closest('.mcq'),o);return;}
 const l=e.target.closest('[data-lv]');if(l&&!l.disabled){lvShow(+l.dataset.lv);return;}
});

/* =====================================================================
   BERANDA
   ===================================================================== */
views[0]=v=>{
 v.innerHTML='<div class="card hero"><i class="fl f1"></i><i class="fl f2"></i><i class="fl f3"></i><i class="fl f4"></i>'+
 '<span class="pill">PLATFORM BELAJAR MANDIRI · 120 MENIT</span><h1>AlgoQuest</h1>'+
 '<p style="font-size:1.1rem;max-width:680px;margin:10px auto 18px">Kuasai <b>Pseudocode</b> dan <b>Diagram Alir (Flowchart)</b> — fokus pada <b>Input, Output, dan Percabangan</b> (IF-THEN / IF-THEN-ELSE) lewat teori, studi kasus, lab maya, dan game 5 level.</p>'+
 '<div class="row" style="justify-content:center"><input id="nm" class="inp" style="max-width:260px;flex:none" placeholder="Nama kamu (opsional)" value="'+attr(S.name)+'"><button class="btn primary big" id="startBtn">'+(S.started?'▶ Lanjutkan Belajar':'🚀 Mulai Belajar (120 Menit)')+'</button></div>'+

function evalCond(L,b,vals){
 const x=L.vars[b.vi];if(!x)return false;let a=vals[b.vi],r=b.val;
 if(x.t==='number'){a=parseFloat(a);r=parseFloat(r);if(isNaN(a)||isNaN(r))return false;}
 else{a=String(a).trim().toLowerCase();r=String(r).trim().toLowerCase();}
 switch(b.op){case'>':return a>r;case'>=':return a>=r;case'<':return a<r;case'<=':return a<=r;case'==':return a===r;case'!=':return a!==r;}return false;
}
function interp(t,vals,L){return String(t).replace(/\{(\w+)\}/g,(m,n)=>{const i=L.vars.findIndex(x=>x.n===n);return i>=0?vals[i]:m;});}
function runProg(L,inArr){
 const vals=L.vars.map((x,i)=>x.t==='number'?parseFloat(inArr[i]):String(inArr[i]===undefined?'':inArr[i]));
 for(let j=0;j<L.br.length;j++)if(evalCond(L,L.br[j],vals))return interp(L.br[j].out,vals,L);
 return L.el?interp(L.eo,vals,L):'';
}

const CAT={k:'Pengetahuan Konseptual',s:'Keterampilan Prosedural',m:'Metakognisi'};
const RQ=['Bagian mana yang paling sulit bagimu, dan strategi apa yang kamu pakai untuk mengatasinya?','Berikan satu contoh situasi sehari-hari (di luar contoh modul) yang memakai percabangan IF-THEN-ELSE.','Apa targetmu selanjutnya setelah materi ini, dan langkah konkret apa yang akan kamu lakukan?'];
function reflOK(){return LIK.every((_,i)=>S.rf.lik[i])&&S.rf.q.every(q=>q.trim().length>=15);}
function likAvg(){const r={k:[],s:[],m:[]};LIK.forEach((l,i)=>{if(S.rf.lik[i])r[l[0]].push(S.rf.lik[i]);});const o={};let all=[];for(const k in r){o[k]=r[k].length?r[k].reduce((a,b)=>a+b,0)/r[k].length:0;all=all.concat(r[k]);}o.all=all.length?all.reduce((a,b)=>a+b,0)/all.length:0;return o;}
function levelOf(x){return x>=4.2?['Sangat Percaya Diri','Pertahankan! Coba tantang dirimu dengan percabangan bersarang & operator AND/OR.']:x>=3.4?['Berkembang Baik','Ulangi Level 4–5 game dan Misi Lab untuk memantapkan.']:x>=2.6?['Perlu Penguatan','Kembali ke Modul 1 (tab Percabangan) dan Modul 2, lalu latih Lab Maya.']:['Perlu Pendampingan','Diskusikan dengan guru/teman, ulangi Modul 1 dengan animasi langkah demi langkah.'];}
views[6]=v=>{
 v.innerHTML=modHead(6,'Nilai dirimu secara jujur (skala Likert) dan tulis refleksi. Ini membantumu mengenali cara belajarmu sendiri.')+
 '<div class="card"><h3>📏 Self-Assessment (1 = Sangat tidak setuju · 5 = Sangat setuju)</h3>'+LIK.map((l,i)=>'<div class="lik"><div><span class="tag in">'+CAT[l[0]]+'</span><br>'+l[1]+'</div><div class="scale" data-l="'+i+'">'+[1,2,3,4,5].map(n=>'<label><input type="radio" name="l'+i+'" value="'+n+'"'+(S.rf.lik[i]===n?' checked':'')+'><span>'+n+'</span></label>').join('')+'</div></div>').join('')+'<div id="likres" style="margin-top:14px"></div></div>'+
 '<div class="card"><h3>💭 Refleksi (minimal 15 karakter per jawaban)</h3>'+RQ.map((q,i)=>'<p style="margin-top:10px"><b>'+(i+1)+'. '+q+'</b></p><textarea class="inp rq" data-q="'+i+'" placeholder="Tulis refleksimu…">'+esc(S.rf.q[i])+'</textarea><small class="cc">'+S.rf.q[i].trim().length+' karakter</small>').join('')+'</div>'+
 '<div id="rep"></div>'+finBlock(6);
 const lr=()=>{const a=likAvg(),n=Object.keys(S.rf.lik).length;$('#likres',v).innerHTML=n?'<div class="g3">'+['k','s','m'].map(k=>'<div><small>'+CAT[k]+'</small><div class="meter"><i style="width:'+a[k]/5*100+'%"></i></div><b>'+a[k].toFixed(1)+' / 5</b></div>').join('')+'</div>'+(n===LIK.length?'<div class="callout ok2" style="margin-top:12px">Rata-rata <b>'+a.all.toFixed(2)+'</b> → <b>'+levelOf(a.all)[0]+'</b>. '+levelOf(a.all)[1]+'</div>':'<small>Jawab semua 8 pernyataan untuk melihat interpretasi.</small>'):'';};
 lr();
 v.addEventListener('change',e=>{const s=e.target.closest('.scale');if(s&&e.target.type==='radio'){S.rf.lik[+s.dataset.l]=+e.target.value;save();lr();}});
 v.addEventListener('input',e=>{if(e.target.classList.contains('rq')){S.rf.q[+e.target.dataset.q]=e.target.value;e.target.nextElementSibling.textContent=e.target.value.trim().length+' karakter';save();}});
 if(S.done[6])showReport();
};
function reportText(){
 const a=likAvg(),sp=Object.values(S.spent).reduce((x,y)=>x+y,0),gl=Object.keys(S.game.done).filter(k=>S.game.done[k]).length,ms=Object.keys(S.miss).filter(k=>S.miss[k]).length,s=lkStats();
 return 'LAPORAN BELAJAR — AlgoQuest\n============================\nNama            : '+(S.name||'Peserta didik')+'\nWaktu belajar   : '+fmt(sp)+' dari 120:00\nModul selesai   : '+Object.keys(S.done).filter(k=>S.done[k]).length+'/6\nTotal XP        : '+S.score+'\nGame            : level selesai '+gl+'/5 · skor game '+(S.gs||0)+'\nMisi Lab        : '+ms+'/3\nLKPD            : PG '+s.mc+'/'+LQ.length+' · Isian '+s.fl+'/'+FILL.length+' · Tugas 1 '+(S.lk.t1ok?'lengkap':'belum')+'\n\nSELF-ASSESSMENT (skala 1–5)\n- '+CAT.k+': '+a.k.toFixed(1)+'\n- '+CAT.s+': '+a.s.toFixed(1)+'\n- '+CAT.m+': '+a.m.toFixed(1)+'\n- Rata-rata: '+a.all.toFixed(2)+' ('+levelOf(a.all)[0]+')\n\nREFLEKSI\n'+RQ.map((q,i)=>(i+1)+'. '+q+'\n   → '+S.rf.q[i].trim()).join('\n')+'\n';
}
function showReport(){
 const h=$('#rep');if(!h)return;
 h.innerHTML='<div class="card"><h3>🏁 Laporan Belajar Akhir</h3><div class="report">'+esc(reportText())+'</div><div class="btns"><button class="btn primary" id="rd">⬇ Unduh Laporan (.txt)</button><button class="btn" id="rp">🖨 Cetak</button></div><div class="callout ok2" style="margin-top:12px">Terima kasih sudah belajar mandiri. Terus latihan membuat flowchart untuk masalah di sekitarmu! 🚀</div></div>';
 $('#rd').onclick=()=>download('Laporan_AlgoQuest.txt',reportText());$('#rp').onclick=()=>window.print();
}
const _fm=finishMod;
finishMod=function(n){_fm(n);if(n===6&&S.done[6])setTimeout(()=>{showReport();const r=$('#rep');if(r)r.scrollIntoView({behavior:'smooth'});},50);};

/* ---------- start ---------- */
render();
</script>
</body>
</html>
